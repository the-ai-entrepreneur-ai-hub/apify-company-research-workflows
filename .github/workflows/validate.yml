name: Validate workflow assets
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s test -p test_windmill.py -v
